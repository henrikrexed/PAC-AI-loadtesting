# Secret template for the tutorial demo component. DO NOT COMMIT real values.
#
# 1. Copy the pattern, create the REAL secrets at deploy time with kubectl, e.g.:
#      kubectl -n agentapp create secret generic deepseek-api \
#        --from-literal=apiKey="$DEEPSEEK_API_KEY"
#      kubectl -n agentapp create secret generic dt-otlp \
#        --from-literal=tenantUrl="https://your-environment.live.dynatrace.com/api/v2/otlp" \
#        --from-literal=apiToken="$DT_OTLP_API_TOKEN"
#    (never `kubectl apply` this file with real values in it)
#
# 2. DEEPSEEK_API_KEY — your own key from https://platform.deepseek.com
# 3. dt-otlp — points the collector (collector.yaml) at YOUR Dynatrace OTLP ingest:
#      tenantUrl: https://<your-environment>.live.dynatrace.com/api/v2/otlp
#      apiToken:  an ingest token with scope `ingestion:otlp:write`
#     (this ingest token is separate from the read-only DT_API_TOKEN used for DQL queries)
---
apiVersion: v1
kind: Secret
metadata:
  name: deepseek-api
  namespace: agentapp
type: Opaque
stringData:
  apiKey: "REPLACE_ME"
---
apiVersion: v1
kind: Secret
metadata:
  name: dt-otlp
  namespace: agentapp
type: Opaque
stringData:
  tenantUrl: "https://your-environment.live.dynatrace.com/api/v2/otlp"
  apiToken: "REPLACE_ME"
