# Secrets for the agent app. DO NOT COMMIT real values — this is a template.
# Create the real secrets at deploy time (README §3), e.g.:
#   kubectl -n agentapp create secret generic deepseek-api \
#     --from-literal=apiKey="$DEEPSEEK_API_KEY"
#   kubectl -n agentapp create secret generic dt-otlp-token \
#     --from-literal=tenantUrl="https://oat05854.live.dynatrace.com/api/v2/otlp" \
#     --from-literal=apiToken="$DT_API_TOKEN"
#
# The dt-otlp-token secret mirrors the one the ISI-4089 pac-lt-collector uses; the agent
# collector (collector.yaml) reads it to export to oat05854.
---
apiVersion: v1
kind: Secret
metadata:
  name: deepseek-api
  namespace: agentapp
  labels: { pac.lt/issue: ISI-5644 }
type: Opaque
stringData:
  apiKey: "REPLACE_ME_DEEPSEEK_API_KEY"
---
apiVersion: v1
kind: Secret
metadata:
  name: dt-otlp-token
  namespace: agentapp
  labels: { pac.lt/issue: ISI-5644 }
type: Opaque
stringData:
  tenantUrl: "https://oat05854.live.dynatrace.com/api/v2/otlp"
  apiToken: "REPLACE_ME_DT_OTLP_INGEST_TOKEN"
