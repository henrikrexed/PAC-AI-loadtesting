# Dedicated OTel collector for the generalization-test agent app (ISI-5644).
# Modeled on deploy/otel-demo/pac-lt-collector.yaml (ISI-4089) so the app is self-contained
# and does NOT depend on the memory-benchmark collector's lifecycle. Exports to Dynatrace
# oat05854 and stamps a distinctive deployment.environment so DQL can isolate this workload.
#
# Pipeline (critical-rule order: memory_limiter FIRST, batch LAST):
#   otlp -> memory_limiter -> resource/agent -> batch -> otlphttp/dynatrace (oat05854)
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: agent-collector
  namespace: agentapp
  labels: { app: agent-collector, pac.lt/issue: ISI-5644 }
data:
  collector.yaml: |
    receivers:
      otlp:
        protocols:
          grpc: { endpoint: 0.0.0.0:4317 }
          http: { endpoint: 0.0.0.0:4318 }
    processors:
      memory_limiter:
        check_interval: 1s
        limit_mib: 400
        spike_limit_mib: 100
      resource/agent:
        attributes:
          - { key: deployment.environment, value: pac-lt-generalization, action: upsert }
          - { key: pac.lt.issue,           value: ISI-5644,              action: upsert }
      cumulativetodelta: {}
      batch:
        send_batch_size: 1024
        timeout: 5s
    exporters:
      otlphttp/dynatrace:
        endpoint: ${env:DT_OTLP_ENDPOINT}
        headers:
          Authorization: "Api-Token ${env:DT_API_TOKEN}"
        compression: gzip
        timeout: 30s
        retry_on_failure: { enabled: true, initial_interval: 5s, max_interval: 30s, max_elapsed_time: 300s }
        sending_queue: { enabled: true, queue_size: 5000 }
    service:
      telemetry:
        metrics: { level: basic }
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, resource/agent, batch]
          exporters: [otlphttp/dynatrace]
        logs:
          receivers: [otlp]
          processors: [memory_limiter, resource/agent, batch]
          exporters: [otlphttp/dynatrace]
        metrics:
          receivers: [otlp]
          processors: [memory_limiter, resource/agent, cumulativetodelta, batch]
          exporters: [otlphttp/dynatrace]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-collector
  namespace: agentapp
  labels: { app: agent-collector, pac.lt/issue: ISI-5644 }
spec:
  replicas: 1
  selector: { matchLabels: { app: agent-collector } }
  template:
    metadata:
      labels: { app: agent-collector, pac.lt/issue: ISI-5644 }
      annotations: { sidecar.istio.io/inject: "false" }
    spec:
      containers:
        - name: collector
          image: otel/opentelemetry-collector-contrib:0.135.0
          args: ["--config=/etc/collector/collector.yaml"]
          env:
            - name: DT_OTLP_ENDPOINT
              valueFrom: { secretKeyRef: { name: dt-otlp-token, key: tenantUrl } }
            - name: DT_API_TOKEN
              valueFrom: { secretKeyRef: { name: dt-otlp-token, key: apiToken } }
          ports:
            - { containerPort: 4317, name: otlp-grpc }
            - { containerPort: 4318, name: otlp-http }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits:   { cpu: 500m, memory: 512Mi }
          volumeMounts:
            - { name: config, mountPath: /etc/collector }
      volumes:
        - name: config
          configMap: { name: agent-collector }
---
apiVersion: v1
kind: Service
metadata:
  name: agent-collector
  namespace: agentapp
  labels: { app: agent-collector, pac.lt/issue: ISI-5644 }
spec:
  selector: { app: agent-collector }
  ports:
    - { name: otlp-grpc, port: 4317, targetPort: 4317 }
    - { name: otlp-http, port: 4318, targetPort: 4318 }
