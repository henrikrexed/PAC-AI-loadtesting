name: secret-scan

# Fail-closed pre-publish gate: any commit/PR that reintroduces a token, tenant
# URL, private IP, credential assignment, internal identifier, internal issue-tracker
# id, the internal platform name, or an internal project-name variant fails CI.
# Backed by tools/secret-scan.sh (same scan used by the publish pipeline).

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run secret scan
        run: bash tools/secret-scan.sh
