<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="256" height="256" role="img" aria-label="Knightload monogram / app icon">
  <title>Knightload — K monogram (app icon)</title>
  <defs>
    <mask id="moonK">
      <rect x="0" y="0" width="100" height="100" fill="white"/>
      <circle cx="48.1" cy="48.9" r="4.6" fill="black"/>
    </mask>
  </defs>
  <!-- app tile -->
  <rect x="4" y="4" width="92" height="92" rx="20" fill="#1A1A2E"/>
  <!-- vertical stem of the K -->
  <rect x="25.5" y="20" width="10" height="60" rx="2" fill="#C7CDD6"/>
  <!-- upper arm = ascending bars -->
  <g fill="#2EE6D6">
    <rect x="44" y="40" width="8.5" height="22.5" rx="1.4"/>
    <rect x="54.5" y="30" width="8.5" height="25.5" rx="1.4"/>
    <rect x="65.5" y="18.5" width="8.5" height="28.5" rx="1.4"/>
  </g>
  <!-- lower arm (balancing stroke) -->
  <polygon points="37,50 52,52 70,80 58.5,80 40,56" fill="#C7CDD6"/>
  <!-- crescent-moon counter in the junction -->
  <circle cx="45.5" cy="50.5" r="5" fill="#2EE6D6" mask="url(#moonK)"/>
</svg>
