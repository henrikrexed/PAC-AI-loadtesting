<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="256" height="256" role="img" aria-label="Knightload — Visor Gauge mark">
  <title>Knightload — Concept A: Visor Gauge</title>
  <defs>
    <mask id="helmCut">
      <rect x="0" y="0" width="100" height="100" fill="white"/>
      <!-- thin crescent moon carved from the dome (negative space) -->
      <circle cx="38.5" cy="25.5" r="9.3" fill="black"/>
      <circle cx="44.3" cy="24.9" r="9.0" fill="white"/>
      <!-- visor slot cut-out -->
      <rect x="28.5" y="40" width="43" height="10" rx="2" fill="black"/>
    </mask>
  </defs>
  <!-- great-helm body -->
  <path d="M23.5 34 A26.5 23.5 0 0 1 76.5 34 L74 62 L71.5 86 Q71.5 92 65.5 92 L34.5 92 Q28.5 92 28.5 86 L26 62 Z"
        fill="#C7CDD6" mask="url(#helmCut)"/>
  <!-- central ridge -->
  <line x1="50" y1="11" x2="50" y2="30" stroke="#C7CDD6" stroke-width="1.2"/>
  <!-- visor = ascending load bars / throughput waveform -->
  <g fill="#2EE6D6">
    <rect x="29.7" y="47.5" width="3.5" height="1.9" rx="0.5"/>
    <rect x="35.5" y="46.4" width="3.5" height="3.0" rx="0.5"/>
    <rect x="41.3" y="45.1" width="3.5" height="4.3" rx="0.5"/>
    <rect x="47.1" y="43.6" width="3.5" height="5.8" rx="0.5"/>
    <rect x="52.9" y="44.7" width="3.5" height="4.7" rx="0.5"/>
    <rect x="58.7" y="42.4" width="3.5" height="7.0" rx="0.5"/>
    <rect x="64.5" y="40.9" width="3.5" height="8.5" rx="0.5"/>
  </g>
  <!-- breathing holes: ascending dot chevron -->
  <g fill="#2EE6D6">
    <circle cx="40" cy="66" r="1.3"/>
    <circle cx="45.5" cy="69" r="1.3"/>
    <circle cx="50" cy="70.5" r="1.3"/>
    <circle cx="54.5" cy="69" r="1.3"/>
    <circle cx="60" cy="66" r="1.3"/>
  </g>
</svg>
