<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="256" height="256" role="img" aria-label="Knightload — Shield Load-Bar mark">
  <title>Knightload — Concept C: Shield Load-Bar</title>
  <defs>
    <mask id="moonC">
      <rect x="0" y="0" width="100" height="100" fill="white"/>
      <circle cx="52.8" cy="11.7" r="5.2" fill="black"/>
    </mask>
  </defs>
  <!-- heater shield -->
  <path d="M26 19.5 L74 19.5 L74.5 42 C73 64 62 80 50 89 C38 80 27 64 25.5 42 L26 19.5 Z"
        fill="#C7CDD6"/>
  <!-- load bar track + fill -->
  <rect x="33.5" y="45.5" width="33" height="7" rx="3" fill="#1A1A2E"/>
  <rect x="34.1" y="46.1" width="21.1" height="5.8" rx="2.5" fill="#2EE6D6"/>
  <!-- ascending ramp ticks -->
  <rect x="37" y="37.0" width="2.8" height="3.0" rx="0.4" fill="#2EE6D6"/>
  <rect x="44" y="35.4" width="2.8" height="4.6" rx="0.4" fill="#C7CDD6"/>
  <rect x="51" y="33.8" width="2.8" height="6.2" rx="0.4" fill="#2EE6D6"/>
  <rect x="58" y="32.2" width="2.8" height="7.8" rx="0.4" fill="#C7CDD6"/>
  <rect x="63" y="30.6" width="2.8" height="9.4" rx="0.4" fill="#2EE6D6"/>
  <!-- crescent-moon plume at the crest -->
  <circle cx="50" cy="13.5" r="5.8" fill="#2EE6D6" mask="url(#moonC)"/>
</svg>
