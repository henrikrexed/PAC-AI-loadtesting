name: docker

# Multi-arch container image -> GHCR.
#
# This is the ONE pipeline that builds/pushes the engine image, so it runs in
# three modes:
#   - pull_request  -> build only (no push) + Trivy scan  [CI gate on every PR]
#   - push to main  -> build + push `edge` and `main-<sha>`
#   - tag `v*`      -> build + push `{version}`, `{major}.{minor}`, and `latest`
#                      + Trivy scan + CycloneDX SBOM attached to the run
#
# `release.yml` deliberately does NOT build an image — keeping a single push
# path avoids duplicate/competing pipelines.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write        # push to GHCR
  security-events: read  # Trivy table output (no code-scanning upload required)

env:
  IMAGE: ghcr.io/henrikrexed/ai-performance-testing

jobs:
  image:
    name: image (GHCR)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      # Push only on main + tags; PRs build and scan but never publish.
      - name: Decide whether to push
        id: push
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to GHCR
        if: steps.push.outputs.enabled == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=edge,branch=main
            type=sha,prefix=main-,enable=${{ github.ref == 'refs/heads/main' }}

      # On PRs: single-arch amd64 load into the local daemon so Trivy can scan it.
      # On push/tag: multi-arch build straight to the registry.
      - name: Build (PR, load for scan)
        if: steps.push.outputs.enabled == 'false'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ env.IMAGE }}:pr-${{ github.event.pull_request.number }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Build and push (main/tag, multi-arch)
        if: steps.push.outputs.enabled == 'true'
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          sbom: true

      # Trivy on every PR and every release/tag (security remit).
      - name: Trivy scan (PR image)
        if: steps.push.outputs.enabled == 'false'
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.IMAGE }}:pr-${{ github.event.pull_request.number }}
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Trivy scan (released image)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.ref_name }}
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Generate CycloneDX SBOM (released image)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE }}:${{ github.ref_name }}
          format: cyclonedx-json
          output-file: image.cyclonedx.json

      - name: Upload image SBOM
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: image-sbom-${{ github.ref_name }}
          path: image.cyclonedx.json
          if-no-files-found: error
